<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Readme Dashboard Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0d1117] text-[#c9d1d9] font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- Customization Controls Panel -->
        <div class="md:col-span-5 bg-[#161b22] p-6 rounded-xl border border-[#30363d] space-y-4">
            <h2 class="text-lg font-bold text-white border-b border-[#30363d] pb-2">🎨 Customization Studio</h2>

            <div>
                <label class="block text-xs font-semibold mb-1">GitHub Username</label>
                <input type="text" id="username" value="octocat" oninput="updateCard()" 
                    class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-sm text-white focus:outline-none focus:border-[#58a6ff]">
            </div>

            <div>
                <label class="block text-xs font-semibold mb-1">Preset Theme</label>
                <select id="theme" onchange="updateCard()" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-sm text-white">
                    <option value="dark">Dark</option>
                    <option value="light">Light</option>
                    <option value="dracula">Dracula</option>
                    <option value="tokyonight">Tokyo Night</option>
                    <option value="nord">Nord</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold mb-1">Accent Color (Hex)</label>
                    <input type="text" id="accent_color" placeholder="e.g. 58a6ff" oninput="updateCard()" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Border Radius</label>
                    <input type="number" id="border_radius" value="10" min="0" max="25" oninput="updateCard()" class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-sm text-white">
                </div>
            </div>

            <div class="space-y-2 border-t border-[#30363d] pt-3">
                <label class="block text-xs font-semibold">Toggles & Elements</label>
                <div class="flex items-center gap-4 text-xs">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="show_icons" checked onchange="updateCard()"> Show Icons
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="show_repos" checked onchange="updateCard()"> Repos
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="checkbox" id="show_followers" checked onchange="updateCard()"> Followers
                    </label>
                </div>
            </div>

            <div class="border-t border-[#30363d] pt-3">
                <label class="block text-xs font-semibold mb-1">Markdown Embed Link</label>
                <textarea id="embedOutput" readonly class="w-full bg-[#0d1117] border border-[#30363d] rounded p-2 text-xs font-mono text-gray-300 h-20 resize-none"></textarea>
            </div>
        </div>

        <!-- Live Card Preview -->
        <div class="md:col-span-7 bg-[#161b22] p-6 rounded-xl border border-[#30363d] flex flex-col items-center justify-center min-h-[300px]">
            <h3 class="text-xs uppercase tracking-wider text-gray-400 mb-4">Live Dynamic Preview</h3>
            <div id="previewWrapper" class="p-4 rounded bg-[#0d1117] border border-[#30363d]">
                <img id="previewImg" src="" alt="Dynamic Card Preview">
            </div>
        </div>

    </div>

    <script>
        function updateCard() {
            const user = document.getElementById('username').value.trim() || 'octocat';
            const theme = document.getElementById('theme').value;
            const accent = document.getElementById('accent_color').value.trim().replace('#','');
            const radius = document.getElementById('border_radius').value;
            const icons = document.getElementById('show_icons').checked;
            const repos = document.getElementById('show_repos').checked;
            const followers = document.getElementById('show_followers').checked;

            let query = `username=${user}&theme=${theme}&border_radius=${radius}&show_icons=${icons}&show_repos=${repos}&show_followers=${followers}`;
            if (accent) query += `&accent_color=${accent}`;

            const fullUrl = `${window.location.origin}/api/card?${query}`;
            
            document.getElementById('previewImg').src = fullUrl;
            document.getElementById('embedOutput').value = `![GitHub Dashboard](${fullUrl})`;
        }

        window.onload = updateCard;
    </script>
</body>
</html>
