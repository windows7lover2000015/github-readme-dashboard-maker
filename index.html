<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub SVG Dashboard — Live Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #090d16; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
        .theme-btn { transition: all 0.2s ease; cursor: pointer; }
        .theme-btn:hover { border-color: #3b82f6; transform: translateY(-2px); }
        .theme-btn.active { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="min-h-screen py-10 px-4 flex flex-col items-center">

    <div class="max-w-4xl w-full space-y-8">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Customize your dashboard</h1>
            <p class="text-sm text-gray-400">Pick a theme, toggle sections on/off, and get a shareable SVG link for any README.</p>
        </div>

        <div class="glass-card p-6 space-y-6">
            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-b border-gray-800 pb-5">
                <div class="w-full sm:w-1/2">
                    <label class="block text-xs font-medium text-gray-400 mb-1">GitHub Username</label>
                    <input type="text" id="usernameInput" value="windows7lover2000015" oninput="updateDashboard()" 
                        class="w-full bg-[#030712] border border-gray-800 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button onclick="updateDashboard()" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-lg transition shadow-lg">
                    Generate <i class="fa-solid fa-rotate ml-1"></i>
                </button>
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-400 mb-3">SVG Theme</label>
                <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
                    <div onclick="setTheme('midnight', this)" class="theme-btn active p-3 rounded-lg bg-[#0d1117] border border-gray-800 flex flex-col justify-between h-20">
                        <span class="text-xs font-bold text-white">Midnight</span>
                        <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span class="w-2 h-2 rounded-full bg-purple-500"></span></div>
                    </div>
                    <div onclick="setTheme('dracula', this)" class="theme-btn p-3 rounded-lg bg-[#282a36] border border-gray-800 flex flex-col justify-between h-20">
                        <span class="text-xs font-bold text-white">Dracula</span>
                        <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-pink-500"></span><span class="w-2 h-2 rounded-full bg-purple-400"></span></div>
                    </div>
                    <div onclick="setTheme('sunset', this)" class="theme-btn p-3 rounded-lg bg-[#1f1624] border border-gray-800 flex flex-col justify-between h-20">
                        <span class="text-xs font-bold text-white">Sunset</span>
                        <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-orange-400"></span><span class="w-2 h-2 rounded-full bg-pink-500"></span></div>
                    </div>
                    <div onclick="setTheme('forest', this)" class="theme-btn p-3 rounded-lg bg-[#0f1f17] border border-gray-800 flex flex-col justify-between h-20">
                        <span class="text-xs font-bold text-white">Forest</span>
                        <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="w-2 h-2 rounded-full bg-teal-400"></span></div>
                    </div>
                    <div onclick="setTheme('nord', this)" class="theme-btn p-3 rounded-lg bg-[#2e3440] border border-gray-800 flex flex-col justify-between h-20">
                        <span class="text-xs font-bold text-white">Nord</span>
                        <div class="flex gap-1"><span class="w-2 h-2 rounded-full bg-cyan-400"></span><span class="w-2 h-2 rounded-full bg-blue-300"></span></div>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-800 pt-4">
                <label class="block text-xs font-medium text-gray-400 mb-3">Dashboard Sections</label>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                    <label class="flex items-center justify-between p-2.5 bg-[#030712] rounded-lg border border-gray-800 cursor-pointer">
                        <span>Profile Card</span> <input type="checkbox" id="t_profile" checked onchange="updateDashboard()" class="accent-blue-500">
                    </label>
                    <label class="flex items-center justify-between p-2.5 bg-[#030712] rounded-lg border border-gray-800 cursor-pointer">
                        <span>Stats</span> <input type="checkbox" id="t_stats" checked onchange="updateDashboard()" class="accent-blue-500">
                    </label>
                    <label class="flex items-center justify-between p-2.5 bg-[#030712] rounded-lg border border-gray-800 cursor-pointer">
                        <span>Languages</span> <input type="checkbox" id="t_langs" checked onchange="updateDashboard()" class="accent-blue-500">
                    </label>
                    <label class="flex items-center justify-between p-2.5 bg-[#030712] rounded-lg border border-gray-800 cursor-pointer">
                        <span>Top Repos</span> <input type="checkbox" id="t_repos" checked onchange="updateDashboard()" class="accent-blue-500">
                    </label>
                </div>
            </div>
        </div>

        <div class="glass-card p-6 flex flex-col items-center justify-center space-y-4">
            <div class="w-full flex items-center justify-between text-xs text-gray-400 border-b border-gray-800 pb-3">
                <span class="uppercase tracking-wider font-semibold">Live Preview</span>
                <span class="text-green-400 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> SVG Active</span>
            </div>
            <div class="w-full overflow-x-auto p-4 bg-[#030712] rounded-xl border border-gray-800 flex justify-center">
                <img id="cardPreview" src="" alt="Live SVG Dashboard Preview" class="max-w-full h-auto shadow-2xl rounded-lg">
            </div>
        </div>

        <div class="glass-card p-6 space-y-3">
            <h2 class="text-sm font-semibold text-white">Shareable SVG URL</h2>
            <div class="relative">
                <input type="text" id="shareUrl" readonly class="w-full bg-[#030712] border border-gray-800 rounded-lg p-3 text-xs font-mono text-gray-300 focus:outline-none">
                <button onclick="copyLink()" class="absolute right-2 top-2 px-3 py-1 bg-gray-800 hover:bg-gray-700 text-xs text-white rounded transition">
                    <i class="fa-regular fa-copy mr-1"></i> Copy
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentTheme = 'midnight';
        function setTheme(themeName, element) {
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentTheme = themeName;
            updateDashboard();
        }
        function updateDashboard() {
            const username = document.getElementById('usernameInput').value.trim() || 'windows7lover2000015';
            const profile = document.getElementById('t_profile').checked;
            const stats = document.getElementById('t_stats').checked;
            const langs = document.getElementById('t_langs').checked;
            const repos = document.getElementById('t_repos').checked;
            const query = `username=${username}&theme=${currentTheme}&profile=${profile}&stats=${stats}&langs=${langs}&repos=${repos}`;
            const fullUrl = `${window.location.origin}/api/card?${query}`;
            document.getElementById('cardPreview').src = fullUrl;
            document.getElementById('shareUrl').value = `![GitHub Dashboard](${fullUrl})`;
        }
        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareUrl').value);
            alert('Copied link!');
        }
        window.onload = updateDashboard;
    </script>
</body>
</html>
