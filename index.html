<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitHub README Dashboard API</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 40px; border-radius: 12px; border: 1px solid #30363d; text-align: center; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { color: #58a6ff; font-size: 22px; margin-top: 0; }
        code { background: #0d1117; padding: 4px 8px; border-radius: 6px; color: #79c0ff; border: 1px solid #30363d; }
        p { font-size: 14px; color: #8b949e; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 GitHub README Dashboard API</h1>
        <p>Your serverless SVG badge generator is live!</p>
        <p>Usage format for your README:</p>
        <p><code>https://github-readme-dashboard-maker.vercel.app/api/card?username=YOUR_USERNAME</code></p>
    </div>
</body>
</html>
